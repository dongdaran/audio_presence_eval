experiment:
  name: random1000_omni_intersection_presence_eval
  seed: 0
  batch_size: 16
  llm_micro_batch_size: 16
  max_new_tokens: 1
  temperature: 0.0
  answer_language: english
hardware:
  gpu: NVIDIA A100 80GB
  expected_vram_gb: 80
paths:
  ontology_json: data/ontology.json
  audio_cache: audio_cache
  results: results/random1000_omni_intersection
  positive_tsv: results/random1000_omni_intersection/yes_samples.tsv
  negative_tsv: results/random1000_omni_intersection/no_samples.tsv
audio:
  sample_rate: 32000
  channels: 1
  yt_dlp_format: bestaudio/best
  download_retries: 3
  request_sleep_seconds: 0.5
prompt:
  template: 'Does this audio contain the sound of {caption}? Respond using only one
    word: yes or no.'
models:
  gemini_3_pro_medium:
    backend: openrouter
    model_id: google/gemini-3.1-pro-preview
    model_id_env: OPENROUTER_EVAL_UNUSED_OVERRIDE
    max_new_tokens: null
    reasoning_effort: medium
  gemini_argon_medium:
    backend: openrouter
    model_id: google/gemini-4-argon
    model_id_env: OPENROUTER_EVAL_UNUSED_OVERRIDE
    max_new_tokens: null
    reasoning_effort: medium
scoring:
  clap:
    text_template: The sound of {caption}.
    batch_size: 16
  cnn14:
    sample_rate: 32000
    batch_size: 16
    mapped_only: true
report:
  output: results/random1000_omni_intersection/gemini_medium_report.md
