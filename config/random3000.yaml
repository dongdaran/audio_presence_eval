experiment:
  name: audioset_caption_presence_eval
  seed: 0
  batch_size: 16
  llm_micro_batch_size: 128
  max_new_tokens: 1
  temperature: 0.0
  answer_language: english
hardware:
  gpu: NVIDIA A100 80GB
  expected_vram_gb: 80
paths:
  positive_tsv: /workspace/audio_presence_eval/results/random3000/yes_samples.tsv
  negative_tsv: /workspace/audio_presence_eval/results/random3000/no_samples.tsv
  ontology_json: /workspace/audio_presence_eval/data/ontology.json
  audio_cache: /workspace/audio_presence_eval/audio_cache
  results: /workspace/audio_presence_eval/results/random3000
audio:
  sample_rate: 32000
  channels: 1
  yt_dlp_format: bestaudio/best
  download_retries: 3
  request_sleep_seconds: 0.5
prompt:
  template: 'Does this audio contain the sound of {caption}? Respond using only one
    word: yes or no.'
models:
  gemini_3_pro:
    backend: openrouter
    model_id: google/gemini-3.1-pro-preview
    max_new_tokens: 4096
  gemini_argon:
    backend: openrouter
    model_id: google/gemini-4-argon
    model_id_env: OPENROUTER_ARGON_MODEL
    max_new_tokens: 4096
  kimi_audio_7b:
    backend: kimi
    model_id: moonshotai/Kimi-Audio-7B-Instruct
  audio_flamingo_3:
    llm_micro_batch_size: 128
    backend: audio_flamingo
    model_id: nvidia/audio-flamingo-3-hf
  qwen3_omni_instruct:
    backend: qwen3_omni
    model_id: Qwen/Qwen3-Omni-30B-A3B-Instruct
    llm_micro_batch_size: 128
scoring:
  clap:
    text_template: The sound of {caption}.
    batch_size: 128
  cnn14:
    sample_rate: 32000
    batch_size: 128
report:
  output: /workspace/audio_presence_eval/results/random3000/README.md
