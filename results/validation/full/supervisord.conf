[unix_http_server]
file=/workspace/audio_presence_eval/results/validation/full/supervisor.sock
chmod=0700
[supervisord]
logfile=/workspace/audio_presence_eval/results/validation/full/supervisord.log
pidfile=/workspace/audio_presence_eval/results/validation/full/supervisord.pid
childlogdir=/workspace/audio_presence_eval/results/validation/full
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///workspace/audio_presence_eval/results/validation/full/supervisor.sock
[program:remaining-models]
command=/workspace/audio_presence_eval/.venv/bin/python -u /workspace/audio_presence_eval/scripts/run_remaining_models.py
directory=/workspace/audio_presence_eval
autostart=true
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/audio_presence_eval/results/random3000/logs/runner.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:clap]
command=/workspace/audio_presence_eval/.venv/bin/python -u /workspace/audio_presence_eval/scripts/run_experiment.py --config /workspace/audio_presence_eval/config/random3000.yaml --task clap
directory=/workspace/audio_presence_eval
autostart=true
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/audio_presence_eval/results/random3000/logs/clap.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:audio-flamingo]
command=/workspace/audio_presence_eval/.venv/bin/python -u /workspace/audio_presence_eval/scripts/run_experiment.py --config /workspace/audio_presence_eval/config/random3000.yaml --task llm --model audio_flamingo_3
directory=/workspace/audio_presence_eval
autostart=true
autorestart=false
startsecs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/audio_presence_eval/results/random3000/logs/audio_flamingo_batch64.log
stdout_logfile_maxbytes=0
redirect_stderr=true
